media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: works
    label: 制作物
    type: file
    path: data/works.json
    format: json
    list: true
    fields:
      - name: title
        label: 作品名
        type: string
        required: true
      - name: category
        label: ジャンル
        type: select
        required: true
        options:
          values:
            - name: music
              label: 音楽
            - name: game
              label: ゲーム
            - name: article
              label: 記事
            - name: other
              label: その他
      - name: date
        label: 公開日（YYYY-MM-DD、不明なら空欄）
        type: string
        description: 作品を公開した日。登録日とは異なります。
      - name: url
        label: 作品のURL
        type: string
        required: true
      - name: description
        label: 説明（任意）
        type: text
      - name: published
        label: 公開
        type: boolean

  - name: news
    label: お知らせ
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: date
        label: 日付（YYYY-MM-DD）
        type: string
        required: true
      - name: title
        label: 内容
        type: string
        required: true
      - name: body
        label: 本文（自由入力・任意）
        type: text
        description: 複数行の文章を入力できます。空欄でも公開できます。
      - name: url
        label: 関連URL（任意）
        type: string
      - name: published
        label: 公開
        type: boolean

  - name: profile
    label: プロフィール
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: bio
        label: 自己紹介
        type: text
        description: 自由に文章を入力できます。改行も表示に反映されます。
      - name: links
        label: 外部リンク
        type: object
        list: true
        fields:
          - name: label
            label: リンク名
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
